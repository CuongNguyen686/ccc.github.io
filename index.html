<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07080c">
<meta name="description" content="Nguyễn Cường iOS • ChatGPTDeveloper — KeyAuth management dashboard">
<title>Nguyễn Cường iOS • ChatGPTDeveloper</title>
<link rel="stylesheet" href="./styles.css">
</head>
<body>
<div class="app">
<aside class="sidebar" id="sidebar">
  <div class="brand"><span class="logo">✦</span><span>Nguyễn Cường <b>iOS</b><small>ChatGPTDeveloper</small></span></div>
  <div class="workspace">🛡️ Production workspace <span id="firebaseStatus" style="margin-left:auto;color:var(--warn);font-size:10px">Firebase…</span></div>
  <nav id="nav"></nav>
  <div class="side-bottom"><div class="plan"><span>Pro Workspace</span><strong>Đang hoạt động</strong><button onclick="go('pricing')">Quản lý gói</button></div><div class="version">v2.1.0 • Firebase RTDB</div></div>
</aside>
<section class="main">
<header class="header"><button class="mobile-menu" onclick="toggleSide()">☰</button><div class="header-title" id="mobileTitle">Tổng quan</div><input class="search" id="globalSearch" placeholder="Tìm nhanh..." oninput="renderCurrent()"><button onclick="toast('Không có thông báo mới')">🔔</button><button class="profile" onclick="go('settings')"><span class="avatar" id="avatar">N</span><span class="name" id="profileName">Developer</span>⌄</button><button onclick="toggleTheme()">☼</button></header>
<main class="content" id="content"></main>
</section></div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()"><div class="modal" id="modal"></div></div><div class="toast" id="toast"></div>
<script src="./app.js" defer></script>
</body>
</html>
